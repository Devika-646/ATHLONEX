<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATHLONEX – Every sport. Every opportunity.</title>
  <meta name="description" content="ATHLONEX: sports opportunities, achievements and TA/DA claims for student athletes." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M12 50 32 10l20 40h-9L32 28 21 50z' fill='%23c6ff3d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" onerror="(window.__miss=window.__miss||[]).push('style.css')" />
</head>
<body>
  <div id="root"></div>
  <div id="modal" class="modal-wrap" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <datalist id="sportlist"></datalist>
  <datalist id="collegelist">
    <option value="Dayananda Sagar University"></option>
    <option value="Bangalore University"></option>
    <option value="Christ University"></option>
    <option value="RV College of Engineering"></option>
    <option value="PES University"></option>
    <option value="Jain University"></option>
    <option value="Manipal Academy of Higher Education"></option>
    <option value="Lovely Professional University"></option>
    <option value="Panjab University"></option>
    <option value="University of Delhi"></option>
  </datalist>
  <script>
    /* shows a readable message instead of a blank page if something is wrong */
    window.addEventListener("error", function (e) {
      var r = document.getElementById("root"); if (!r || r.children.length) return;
      var msg = (e && e.message) || "unknown error";
      r.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;color:#fff;background:#1b2440;border-radius:12px">' +
        '<h2 style="margin-top:0">ATHLONEX could not start</h2>' +
        '<p>Most likely <b>data.js</b> was edited wrongly. Open it in Notepad and check the two lines <b>supabaseUrl</b> and <b>supabaseKey</b>: each value must stay inside straight quotation marks " " and the line must end with a comma.</p>' +
        '<p style="opacity:.8">Technical message: ' + String(msg).replace(/</g, "&lt;") + '</p></div>';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" onerror="(window.__miss=window.__miss||[]).push('internet connection (Supabase library)')"></script>
  <script src="data.js" onerror="(window.__miss=window.__miss||[]).push('data.js')"></script>
  <script src="events-real.js" onerror="(window.__miss=window.__miss||[]).push('events-real.js')"></script>
  <script src="app.js" onerror="(window.__miss=window.__miss||[]).push('app.js')"></script>
  <script>
    /* if the page is still empty after loading, say exactly what is missing */
    window.addEventListener("load", function () {
      setTimeout(function () {
        var r = document.getElementById("root");
        if (!r || r.children.length) return;
        var miss = window.__miss || [];
        var why = miss.length
          ? "These files could not be loaded: <b>" + miss.join(", ") + "</b>. Make sure they are in the SAME folder as index.html and are named exactly like this (no .txt at the end, no (1) in the name)."
          : "The files loaded but the app did not start. Press F12, open the Console tab and send the red text to Devika's helper.";
        r.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;color:#fff;background:#1b2440;border-radius:12px"><h2 style="margin-top:0">ATHLONEX could not start</h2><p>' + why + '</p></div>';
        document.body.style.background = "#0b1020";
      }, 800);
    });
  </script>
</body>
</html>
